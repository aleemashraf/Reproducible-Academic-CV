name: Compile Academic CV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release 

      - name: Restore R packages (renv)
        uses: r-lib/actions/setup-renv@v2

      - name: Render CV
        run: quarto render "Aleem Ashraf CV.qmd"

      - name: Commit and Push PDF
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add "Aleem Ashraf CV.pdf"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update compiled CV PDF [skip ci]" && git push)